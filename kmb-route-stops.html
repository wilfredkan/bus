<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九巴路線查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16140f;
    --panel: #201d17;
    --panel-2: #262218;
    --red: #d2232a;
    --amber: #f2a900;
    --text: #f3efe6;
    --muted: #9c9484;
    --line: #3a362c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  main {
    width: 100%;
    max-width: 880px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 6px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  header span.sub {
    font-size: 13px;
    color: var(--muted);
  }

  .company-toggle {
    margin-top: 22px;
    display: inline-flex;
    background: #0d0c09;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 3px;
    gap: 3px;
  }

  .company-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
  }

  .company-btn:hover { color: var(--text); }

  .company-btn.active {
    background: var(--panel-2);
    color: var(--amber);
    font-weight: 700;
  }

  .search-row {
    margin-top: 28px;
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .badge-input {
    display: flex;
    align-items: center;
    background: #0d0c09;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 6px 0 16px;
    flex: 1;
  }

  .badge-input label {
    font-size: 12px;
    color: var(--muted);
    margin-right: 12px;
    white-space: nowrap;
  }

  .badge-input input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--amber);
    font-family: 'Space Grotesk', monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 12px 0;
    min-width: 0;
  }

  .badge-input input::placeholder {
    color: #5a5343;
    -webkit-text-fill-color: #5a5343;
  }

  button#go {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 26px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button#go:hover { background: #b81d24; }
  button#go:disabled { background: #5a3436; cursor: default; }

  .status {
    margin-top: 18px;
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
  }

  .status.error { color: var(--red); }

  .columns {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  @media (max-width: 620px) {
    .columns { grid-template-columns: 1fr; }
  }

  .col {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .col-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }

  .col-head .dir {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .col-head .dest {
    font-size: 17px;
    font-weight: 700;
    margin-top: 4px;
  }

  .stops {
    list-style: none;
    margin: 0;
    padding: 8px 0;
    max-height: 560px;
    overflow-y: auto;
  }

  .stop-item { border-bottom: 1px solid transparent; }
  .stop-item.open { background: var(--panel-2); }

  .stop-row {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 18px;
    background: transparent;
    border: none;
    color: inherit;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }

  .stop-row:hover { background: rgba(255,255,255,0.03); }

  .seq {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'Space Grotesk', monospace;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .stop-name { flex: 1; min-width: 0; }

  .stop-name .tc {
    font-size: 14.5px;
    line-height: 1.4;
  }

  .stop-name .en {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 1px;
  }

  .chev {
    flex: none;
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
    transition: transform 0.15s ease;
  }

  .stop-item.open .chev { transform: rotate(90deg); color: var(--amber); }

  .eta-panel {
    padding: 4px 18px 16px 52px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .eta-panel[hidden] { display: none; }

  .eta-loading, .eta-empty {
    font-size: 13px;
    color: var(--muted);
  }

  .eta-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .eta-min {
    font-family: 'Space Grotesk', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--amber);
    min-width: 54px;
  }

  .eta-min.due { color: var(--red); }

  .eta-meta {
    font-size: 12px;
    color: var(--muted);
  }

  .eta-refresh {
    align-self: flex-start;
    margin-top: 2px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 5px;
    padding: 5px 12px;
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
  }

  .eta-refresh:hover { color: var(--text); border-color: var(--muted); }

  .empty-col {
    padding: 24px 18px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .placeholder {
    margin-top: 60px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.7;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>香港巴士路線查詢</h1>
    <span class="sub">選擇巴士公司，輸入路線號碼，查看去程／返程全部車站</span>
  </header>

  <div class="company-toggle" id="companyToggle">
    <button type="button" class="company-btn active" data-company="kmb">九巴 KMB</button>
    <button type="button" class="company-btn" data-company="ctb">城巴 CTB</button>
  </div>

  <div class="search-row">
    <div class="badge-input">
      <label for="route">路線</label>
      <input id="route" type="text" placeholder="例如 1A" autocomplete="off" autocapitalize="characters">
    </div>
    <button id="go">查詢</button>
  </div>

  <div class="status" id="status"></div>

  <div id="result"></div>
</main>

<script>
const routeInput = document.getElementById('route');
const goBtn = document.getElementById('go');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const companyToggleEl = document.getElementById('companyToggle');

const COMPANIES = {
  kmb: {
    id: 'kmb',
    label: '九巴 KMB',
    routeStopUrl(route, dirKey) {
      return `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dirKey}/1`;
    },
    stopUrl(stopId) {
      return `https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`;
    },
    etaUrl(stopId, route) {
      return `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/1`;
    }
  },
  ctb: {
    id: 'ctb',
    label: '城巴 CTB',
    routeStopUrl(route, dirKey) {
      return `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dirKey}`;
    },
    stopUrl(stopId) {
      return `https://rt.data.gov.hk/v2/transport/citybus/stop/${stopId}`;
    },
    etaUrl(stopId, route) {
      return `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`;
    }
  }
};

let currentCompany = COMPANIES.kmb;

const DIRECTIONS = [
  { key: 'outbound', label: '去程 · Outbound', dirCode: 'O' },
  { key: 'inbound', label: '返程 · Inbound', dirCode: 'I' }
];

const stopCache = new Map();
let currentRoute = '';

async function fetchStopName(company, stopId) {
  const cacheKey = `${company.id}:${stopId}`;
  if (stopCache.has(cacheKey)) return stopCache.get(cacheKey);
  const res = await fetch(company.stopUrl(stopId));
  if (!res.ok) throw new Error('stop fetch failed');
  const json = await res.json();
  stopCache.set(cacheKey, json.data);
  return json.data;
}

async function fetchDirectionStops(company, route, directionKey) {
  const res = await fetch(company.routeStopUrl(route, directionKey));
  if (!res.ok) throw new Error('route-stop fetch failed');
  const json = await res.json();
  return (json.data || []).sort((a, b) => Number(a.seq) - Number(b.seq));
}

async function fetchEta(company, stopId, route, dirCode) {
  const res = await fetch(company.etaUrl(stopId, route));
  if (!res.ok) throw new Error('eta fetch failed');
  const json = await res.json();
  return (json.data || [])
    .filter(e => e.dir === dirCode)
    .sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));
}

function formatEtaRow(entry) {
  if (!entry.eta) {
    const note = entry.rmk_tc || '沒有預計到達時間';
    return `<div class="eta-row"><span class="eta-meta">${note}</span></div>`;
  }
  const now = new Date();
  const etaTime = new Date(entry.eta);
  const mins = Math.round((etaTime - now) / 60000);
  const label = mins <= 0 ? '即將到達' : `${mins} 分鐘`;
  const clock = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  const remark = entry.rmk_tc ? ` · ${entry.rmk_tc}` : '';
  return `
    <div class="eta-row">
      <span class="eta-min${mins <= 0 ? ' due' : ''}">${label}</span>
      <span class="eta-meta">${clock}${remark}</span>
    </div>`;
}

async function loadEtaInto(panel, company, stopId, route, dirCode) {
  panel.innerHTML = `<div class="eta-loading">正在讀取到站時間...</div>`;
  try {
    const rows = await fetchEta(company, stopId, route, dirCode);
    if (!rows.length) {
      panel.innerHTML = `
        <div class="eta-empty">暫無班次資料</div>
        <button class="eta-refresh" type="button">重新整理</button>`;
    } else {
      panel.innerHTML = rows.map(formatEtaRow).join('') +
        `<button class="eta-refresh" type="button">重新整理</button>`;
    }
    panel.querySelector('.eta-refresh').addEventListener('click', () => {
      loadEtaInto(panel, company, stopId, route, dirCode);
    });
  } catch (err) {
    console.error(err);
    panel.innerHTML = `
      <div class="eta-empty">讀取到站時間失敗（有機會係跨網域限制，可以稍後再試）</div>
      <button class="eta-refresh" type="button">重試</button>`;
    panel.querySelector('.eta-refresh').addEventListener('click', () => {
      loadEtaInto(panel, company, stopId, route, dirCode);
    });
  }
}

function renderPlaceholder() {
  resultEl.innerHTML = `<div class="placeholder">輸入路線號碼開始查詢，例如 1A、2、6C、104</div>`;
}

function renderColumns(company, route, columnsData) {
  const cols = columnsData.map(col => {
    if (!col.stops.length) {
      return `
        <div class="col">
          <div class="col-head">
            <div class="dir">${col.label}</div>
            <div class="dest">－</div>
          </div>
          <div class="empty-col">此路線沒有這個方向</div>
        </div>`;
    }
    const dest = col.stops[col.stops.length - 1];
    const items = col.stops.map((s, i) => `
      <li class="stop-item" data-stop="${s.stop}" data-dir="${col.dirCode}" data-company="${company.id}">
        <button class="stop-row" type="button">
          <span class="seq">${i + 1}</span>
          <span class="stop-name">
            <div class="tc">${s.name_tc}</div>
            <div class="en">${s.name_en}</div>
          </span>
          <span class="chev">›</span>
        </button>
        <div class="eta-panel" hidden></div>
      </li>`).join('');
    return `
      <div class="col">
        <div class="col-head">
          <div class="dir">${col.label}</div>
          <div class="dest">往 ${dest.name_tc}</div>
        </div>
        <ul class="stops">${items}</ul>
      </div>`;
  }).join('');

  resultEl.innerHTML = `<div class="columns">${cols}</div>`;
}

async function runSearch() {
  const route = routeInput.value.trim().toUpperCase();
  if (!route) {
    statusEl.textContent = '請先輸入路線號碼';
    statusEl.className = 'status error';
    return;
  }

  const company = currentCompany;
  goBtn.disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = `正在查詢 ${company.label} 路線 ${route}...`;
  resultEl.innerHTML = '';

  try {
    const rawByDirection = await Promise.all(
      DIRECTIONS.map(d => fetchDirectionStops(company, route, d.key).catch(() => []))
    );

    const hasAny = rawByDirection.some(list => list.length > 0);
    if (!hasAny) {
      statusEl.textContent = `找不到 ${company.label} 路線「${route}」，請確認號碼或公司是否正確`;
      statusEl.className = 'status error';
      renderPlaceholder();
      return;
    }

    const allStopIds = [...new Set(rawByDirection.flat().map(r => r.stop))];
    statusEl.textContent = `正在讀取 ${allStopIds.length} 個車站資料...`;

    await Promise.all(allStopIds.map(id => fetchStopName(company, id).catch(() => null)));

    const columnsData = DIRECTIONS.map((d, i) => ({
      label: d.label,
      dirCode: d.dirCode,
      stops: rawByDirection[i]
        .map(r => stopCache.get(`${company.id}:${r.stop}`))
        .filter(Boolean)
    }));

    currentRoute = route;
    renderColumns(company, route, columnsData);
    statusEl.textContent = `${company.label} 路線 ${route} 查詢完成`;
    statusEl.className = 'status';
  } catch (err) {
    console.error(err);
    statusEl.textContent = '查詢時發生錯誤，請稍後再試';
    statusEl.className = 'status error';
  } finally {
    goBtn.disabled = false;
  }
}

resultEl.addEventListener('click', e => {
  const row = e.target.closest('.stop-row');
  if (!row) return;
  const item = row.closest('.stop-item');
  const panel = item.querySelector('.eta-panel');
  const isOpen = item.classList.contains('open');

  document.querySelectorAll('.stop-item.open').forEach(el => {
    if (el !== item) {
      el.classList.remove('open');
      el.querySelector('.eta-panel').hidden = true;
    }
  });

  if (isOpen) {
    item.classList.remove('open');
    panel.hidden = true;
    return;
  }

  item.classList.add('open');
  panel.hidden = false;
  const company = COMPANIES[item.dataset.company];
  loadEtaInto(panel, company, item.dataset.stop, currentRoute, item.dataset.dir);
});

companyToggleEl.addEventListener('click', e => {
  const btn = e.target.closest('.company-btn');
  if (!btn) return;
  currentCompany = COMPANIES[btn.dataset.company];
  companyToggleEl.querySelectorAll('.company-btn').forEach(b => {
    b.classList.toggle('active', b === btn);
  });
  routeInput.value = '';
  statusEl.textContent = '';
  statusEl.className = 'status';
  renderPlaceholder();
});

goBtn.addEventListener('click', runSearch);
routeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});

renderPlaceholder();
</script>
</body>
</html>
