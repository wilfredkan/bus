<!DOCTYPE html>

<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港港鐵實時到站時間</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial;
        background: #f3f5f7;
        color: #222;
    }

    .header {
        background: #111;
        color: white;
        padding: 28px 20px;
        text-align: center;
    }

    .header h1 {
        margin: 0 0 8px;
        font-size: 28px;
    }

    .header p {
        margin: 0;
        opacity: .75;
        font-size: 14px;
    }

    .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 18px;
    }

    .control-card,
    .result-card {
        background: white;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    .control-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
    }

    select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d5d9dd;
        border-radius: 10px;
        background: white;
        font-size: 16px;
        cursor: pointer;
    }

    select:focus {
        outline: none;
        border-color: #111;
    }

    .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid #eee;
    }

    .station-title {
        font-size: 25px;
        font-weight: 800;
    }

    .updated {
        color: #777;
        font-size: 13px;
    }

    .direction {
        margin-top: 20px;
    }

    .direction-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .arrow {
        font-size: 22px;
    }

    .train {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #e7e9eb;
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 8px;
    }

    .train-left {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .minutes {
        font-size: 24px;
        font-weight: 800;
        min-width: 75px;
    }

    .destination {
        font-weight: 700;
    }

    .platform {
        color: #777;
        font-size: 13px;
    }

    .no-train {
        padding: 15px;
        background: #f7f7f7;
        border-radius: 10px;
        color: #777;
    }

    .loading {
        text-align: center;
        padding: 30px;
        color: #777;
    }

    .error {
        padding: 15px;
        border-radius: 10px;
        background: #fff1f1;
        color: #b42318;
        margin-top: 15px;
    }

    .api-info {
        font-size: 12px;
        color: #888;
        line-height: 1.6;
        margin-top: 20px;
    }

    .hidden {
        display: none;
    }

    @media (max-width: 700px) {
        .control-grid {
            grid-template-columns: 1fr;
        }

        .station-title {
            font-size: 21px;
        }

        .status {
            align-items: flex-start;
            flex-direction: column;
            gap: 5px;
        }
    }
</style>

</head>

<body>

<header class="header">
    <h1>🚇 香港港鐵實時到站</h1>
    <p>Hong Kong MTR Real-time Train Information</p>
</header>

<main class="container">

<section class="control-card">

    <div class="control-grid">

        <div>
            <label for="lineSelect">① 選擇港鐵路線</label>
            <select id="lineSelect">
                <option value="">請選擇路線</option>
            </select>
        </div>

        <div>
            <label for="stationSelect">② 選擇車站</label>
            <select id="stationSelect" disabled>
                <option value="">請先選擇路線</option>
            </select>
        </div>

    </div>

    <div id="error" class="error hidden"></div>

</section>


<section id="resultCard" class="result-card hidden">

    <div class="status">
        <div class="station-title" id="stationName"></div>
        <div class="updated" id="updated"></div>
    </div>

    <div id="trainResults">
        <div class="loading">讀取中...</div>
    </div>
    <button id="refreshButton">
        🔄 更新到站時間
    </button>
    <div class="api-info">
        資料來源：香港鐵路有限公司／DATA.GOV.HK<br>
    </div>
    

</section>

</main>

<script>

const lines = {

const fallbackStations = {

        ["YUL","元朗"],

    ],

        ["TST","尖沙咀"],
        ["JOR","佐敦"],

        ["MOK","旺角"],
        ["PRE","太子"],
        ["SSP","深水埗"],
        ["CSW","長沙灣"],
        ["LCK","荔枝角"],
        ["MEF","美孚"],
        ["LAK","荔景"],

    ],

    ISL: [
        ["KET","堅尼地城"],
        ["HKU","香港大學"],
        ["SYP","西營盤"],

        ["CEN","中環"],
        ["ADM","金鐘"],
        ["WAC","灣仔"],
        ["CAB","銅鑼灣"],
        ["TIH","天后"],
        ["FOH","炮台山"],
        ["NOP","北角"],
        ["QUB","鰂魚涌"],
        ["TAK","太古"],
        ["SWH","西灣河"],
        ["SKW","筲箕灣"],
        ["HFC","杏花邨"],
        ["CHW","柴灣"]
    ],

    KTL: [
        ["WHA","黃埔"],
        ["HOM","何文田"],
        ["YMT","油麻地"],
        ["MOK","旺角"],
        ["PRE","太子"],
        ["SKM","石硤尾"],
        ["KOT","九龍塘"],
        ["LOF","樂富"],
        ["WTS","黃大仙"],
        ["DIH","鑽石山"],
        ["CHH","彩虹"],
        ["KOB","九龍灣"],
        ["NTK","牛頭角"],
        ["KWT","觀塘"],
        ["LAT","藍田"],
        ["YAT","油塘"],
        ["TIK","調景嶺"]
    ],

    DRL: [
        ["SUN","欣澳"],
        ["DIS","迪士尼"]
    ]
};

function getStationName(code) {

    for (const line in fallbackStations) {

        const station =
            fallbackStations[line].find(
                item => item[0] === code
            );

        if (station) {
            return station[1];
        }
    }

    // 如果找不到，就顯示原本的代碼
    return code;
}


/*
 * ============================================================
 * 初始化路線選單
 * ============================================================
 */

const lineSelect = document.getElementById("lineSelect");
const stationSelect = document.getElementById("stationSelect");

Object.entries(lines).forEach(([code, name]) => {

    const option = document.createElement("option");

    option.value = code;
    option.textContent = name;

    lineSelect.appendChild(option);
});


/*
 * ============================================================
 * 選擇路線
 * ============================================================
 */

lineSelect.addEventListener("change", async () => {

    const line = lineSelect.value;

    populateStations(line);
    
});

/*
 * ============================================================
 * 建立車站選單
 * ============================================================
 */

function populateStations(stations) {

    stationSelect.innerHTML =
        '<option value="">請選擇車站</option>';

    const stations = fallbackStations[line] || [];

    stations.forEach(([code, name]) => {

        const option =
            document.createElement("option");

        option.value = code;

        option.textContent =
            `${name} (${code})`;

        stationSelect.appendChild(option);
    });

    stationSelect.disabled =
        stations.length === 0;
}


/*
 * ============================================================
 * 選擇車站
 * ============================================================
 */

stationSelect.addEventListener(
    "change",
    () => {

        const line =
            lineSelect.value;

        const station =
            stationSelect.value;

        if (!line || !station) {
            hideResult();
            return;
        }

        loadETA();

    }
);

// 手動更新到站時間
document.getElementById("refreshButton")
    .addEventListener("click", () => {
        loadETA();
    });


/*
 * ============================================================
 * 港鐵 API
 * ============================================================
 */

async function loadETA() {

    const line =
        lineSelect.value;

    const station =
        stationSelect.value;

    if (!line || !station) {
        return;
    }

    showResult();

    const stationText =
        stationSelect.options[
            stationSelect.selectedIndex
        ].textContent;

    document.getElementById(
        "stationName"
    ).textContent =
        stationText;

    document.getElementById(
        "trainResults"
    ).innerHTML =
        '<div class="loading">🚇 正在讀取實時到站資料...</div>';

    clearError();

    /*
     * DATA.GOV.HK / MTR Next Train API
     */
    const url =
        "https://rt.data.gov.hk/v1/transport/mtr/" +
        "getSchedule.php" +
        `?line=${encodeURIComponent(line)}` +
        `&sta=${encodeURIComponent(station)}` +
        "&lang=tc";

    try {

        const response =
            await fetch(url, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const json =
            await response.json();

        if (json.status === 0) {

            showError(
                json.message ||
                "目前沒有服務資料。"
            );

            return;
        }

        renderETA(json);

        document.getElementById(
            "updated"
        ).textContent =
            "最後更新：" +
            new Date().toLocaleTimeString(
                "zh-HK",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

    } catch (error) {

        console.error(error);

        showError(
            "無法取得港鐵實時資料。請稍後再試。"
        );

    }

}


/*
 * ============================================================
 * 顯示到站資料
 * ============================================================
 */

function renderETA(json) {

    const key =
        Object.keys(json.data || {})[0];

    if (!key) {

        document.getElementById(
            "trainResults"
        ).innerHTML =
            '<div class="no-train">目前沒有列車資料。</div>';

        return;
    }

    const stationData =
        json.data[key];

    const container =
        document.getElementById(
            "trainResults"
        );

    container.innerHTML = "";

    /*
     * UP
     */
    renderDirection(
        container,
        "UP",
        stationData.UP || []
    );

    /*
     * DOWN
     */
    renderDirection(
        container,
        "DOWN",
        stationData.DOWN || []
    );
}


/*
 * ============================================================
 * 顯示一個方向
 * ============================================================
 */

function renderDirection(
    container,
    direction,
    trains
) {

    const directionNames = {

        UP: "上行列車",

        DOWN: "下行列車"

    };

    const section =
        document.createElement("div");

    section.className =
        "direction";

    const title =
        document.createElement("div");

    title.className =
        "direction-title";

    title.innerHTML =
        `<span class="arrow">
            ${direction === "UP" ? "⬆️" : "⬇️"}
        </span>
        ${directionNames[direction]}`;

    section.appendChild(title);


    if (!trains.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "no-train";

        empty.textContent =
            "目前沒有列車資料";

        section.appendChild(empty);

    } else {

        trains.forEach(train => {

            section.appendChild(
                createTrainElement(train)
            );

        });

    }

    container.appendChild(section);
}


/*
 * ============================================================
 * 建立列車卡片
 * ============================================================
 */

function createTrainElement(train) {

    const element =
        document.createElement("div");

    element.className =
        "train";

    let minutes =
        train.ttnt;

    if (
        minutes === undefined ||
        minutes === null ||
        minutes === ""
    ) {

        minutes = "-";

    } else {

        minutes =
            String(minutes);

        /*
         * 部分 API 回傳：
         * "On Time"
         * "2"
         * "0"
         */

        if (/^\d+$/.test(minutes)) {

            minutes =
                minutes === "0"
                    ? "即將抵達"
                    : `${minutes} 分鐘`;

        }

    }

    const destination =
        train.dest || "—";

    const platform =
        train.plat
            ? `月台 ${train.plat}`
            : "";

    element.innerHTML = `

        <div class="train-left">

            <div class="minutes">
                ${escapeHTML(minutes)}
            </div>

            <div>
                <div class="destination">
                    前往 ${escapeHTML(getStationName(destination))}
                </div>

                <div class="platform">
                    ${escapeHTML(platform)}
                </div>
            </div>

        </div>

        <div>
            ${formatTrainTime(train.time)}
        </div>

    `;

    return element;
}


/*
 * ============================================================
 * 時間格式化
 * ============================================================
 */

function formatTrainTime(time) {

    if (!time) {
        return "";
    }

    /*
     * API 格式：
     * yyyy-MM-dd HH:mm:ss
     */

    const match =
        String(time).match(
            /(\d{2}):(\d{2}):(\d{2})/
        );

    if (!match) {
        return escapeHTML(time);
    }

    return `
        <strong>
            ${match[1]}:${match[2]}
        </strong>
    `;
}


/*
 * ============================================================
 * 每 10 秒自動更新 - remove remark will work
 * ============================================================
 *

let refreshTimer = null;

function startAutoRefresh() {

    if (refreshTimer) {
        clearInterval(refreshTimer);
    }

    refreshTimer =
        setInterval(() => {

            if (
                lineSelect.value &&
                stationSelect.value
            ) {

                loadETA();

            }

        }, 10000);
}

startAutoRefresh();
*/

/*
 * ============================================================
 * UI functions
 * ============================================================
 */

function showResult() {

    document
        .getElementById("resultCard")
        .classList.remove("hidden");
}

function hideResult() {

    document
        .getElementById("resultCard")
        .classList.add("hidden");
}

function showError(message) {

    const error =
        document.getElementById("error");

    error.textContent =
        message;

    error.classList.remove(
        "hidden"
    );
}

function clearError() {

    document
        .getElementById("error")
        .classList.add("hidden");
}


/*
 * ============================================================
 * 防止 API 文字直接插入 HTML
 * ============================================================
 */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</html>
